# Alembic configuration for front-design-mcp PostgreSQL migrations.
# The live URL is read from FRONT_DESIGN_DATABASE_URL in migrations/env.py;
# sqlalchemy.url below is only a fallback when that env var is unset.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Fallback only — prefer FRONT_DESIGN_DATABASE_URL (never commit real secrets here).
sqlalchemy.url = postgresql+psycopg://front_design:front_design@127.0.0.1:5432/front_design

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

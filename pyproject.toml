[project]
name = "front-design-mcp"
version = "0.1.0"
description = "FastMCP server — specialized frontend UI/UX intelligence for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "miguelcc06", email = "miguel.siak@gmail.com" },
]
keywords = ["mcp", "fastmcp", "frontend", "ui", "ux", "design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==3.4.5",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "structlog>=24.0",
    "typer>=0.12",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]
# Optional embedding providers (not required for default/minimal mode)
embeddings = []

[project.scripts]
front-design-mcp = "front_design_mcp.__main__:main"
front-design-ingest = "front_design_mcp.cli_ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/front_design_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/configs",
    "/data/fixtures",
    "/LICENSE",
    "/README.md",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["front_design_mcp"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

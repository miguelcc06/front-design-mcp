# CI for front-design-mcp
# Least privilege: read repository contents only. No secrets.
#
# The `postgres` job is the ONLY place PostgreSQL tests run.
# `pytest -q` without `-m postgres` must stay green offline
# (postgres-marked tests self-skip when FRONT_DESIGN_TEST_DATABASE_URL is unset).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Mypy
        run: uv run mypy src/front_design_mcp

      - name: Offline ingest
        run: uv run front-design-ingest --offline

      - name: Pytest (offline; postgres tests self-skip)
        run: uv run pytest -q

      - name: RAG evaluation (offline)
        run: uv run python scripts/evaluate_rag.py

      - name: MCP smoke
        run: uv run python scripts/mcp_smoke.py

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    # Dev-only credentials inline — do not use secrets for this job.
    env:
      POSTGRES_USER: front_design
      POSTGRES_PASSWORD: front_design
      POSTGRES_DB: front_design
      FRONT_DESIGN_DATABASE_URL: postgresql+psycopg://front_design:front_design@localhost:5432/front_design
      FRONT_DESIGN_TEST_DATABASE_URL: postgresql://front_design:front_design@localhost:5432/front_design
      FRONT_DESIGN_EMBEDDING_DIMENSIONS: "8"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: front_design
          POSTGRES_PASSWORD: front_design
          POSTGRES_DB: front_design
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U front_design -d front_design"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Alembic downgrade base then upgrade head (reproducible)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Pytest postgres marker
        run: uv run pytest -q -m postgres
